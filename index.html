<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#ffedc2">
<title>合成大果蛙</title>
<style>
  /* ============ 基础（暖黄配色） ============ */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;overflow:hidden;}
  body{
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% -10%, #fffdf3 0%, #fff4d2 40%, #ffe2a4 100%);
    font-family:system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    color:#6b4f1d;user-select:none;-webkit-user-select:none;
  }

  /* 游戏外框：宽高由 JS 按 440:720 计算 */
  #app{
    position:relative;
    border-radius:1.1em;
    overflow:hidden;
    background:#fffdf4;
    box-shadow:0 1.2em 3em rgba(186,146,52,.26), 0 0 0 1px rgba(255,255,255,.9) inset;
    font-size:16px;
  }
  #cv{display:block;width:100%;height:100%;touch-action:none;}

  /* ============ 顶部信息栏 ============ */
  .hud{
    position:absolute;left:0;right:0;top:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:.55em .6em;pointer-events:none;z-index:5;
    transition:opacity .35s ease;
  }
  .hud-left,.hud-right{display:flex;gap:.4em;align-items:flex-start;}
  .score-card{
    background:rgba(255,253,243,.86);
    border:1px solid rgba(230,175,72,.42);
    border-radius:.9em;padding:.34em .7em .4em;
    box-shadow:0 .25em .8em rgba(196,150,52,.18);
    display:flex;flex-direction:column;line-height:1.05;
  }
  .score-card .lbl{font-size:.62em;letter-spacing:.18em;color:#c2a05f;font-weight:600;}
  .score-card .val{
    font-size:1.62em;font-weight:800;color:#6b4f1d;letter-spacing:.02em;
    font-variant-numeric:tabular-nums;display:inline-block;transform-origin:left center;
  }
  .score-card .val.bump{animation:bump .28s ease-out;}
  @keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.28);color:#e0912a}100%{transform:scale(1)}}
  .score-card .best{font-size:.6em;color:#c6a768;margin-top:.1em;}
  .score-card .best i{font-style:normal;font-weight:700;color:#d99a2b;}

  .next-card{
    background:rgba(255,253,243,.86);
    border:1px solid rgba(230,175,72,.42);
    border-radius:.9em;padding:.3em .55em .35em;
    box-shadow:0 .25em .8em rgba(196,150,52,.18);
    display:flex;flex-direction:column;align-items:center;gap:.05em;
  }
  .next-card .lbl{font-size:.56em;letter-spacing:.14em;color:#c2a05f;font-weight:700;}
  .next-card img{width:2.1em;height:2.1em;object-fit:contain;}

  .card-card{
    background:rgba(255,253,243,.86);
    border:1px solid rgba(230,175,72,.42);
    border-radius:.9em;padding:.42em .55em;
    box-shadow:0 .25em .8em rgba(196,150,52,.18);
    font-size:.95em;display:flex;align-items:center;gap:.2em;
    color:#d99a2b;font-weight:800;
  }
  .card-card.empty{opacity:.45;filter:grayscale(.6);}

  /* 音效开关（HUD 默认不吃事件，这里单独打开） */
  .sound-btn{
    pointer-events:auto;cursor:pointer;
    width:1.95em;height:1.95em;padding:0;flex:none;
    border:1px solid rgba(230,175,72,.42);border-radius:50%;
    background:rgba(255,253,243,.86);color:#d99a2b;
    font-size:.86em;line-height:1;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 .25em .8em rgba(196,150,52,.18);
    transition:opacity .2s, filter .2s;
  }
  .sound-btn.off{opacity:.42;filter:grayscale(.8);}

  /* ============ 覆盖页 ============ */
  .screen{
    position:absolute;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:1.1em;padding:1.6em;
    background:linear-gradient(180deg, rgba(255,251,233,.74), rgba(255,245,214,.84));
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
    transition:opacity .3s ease, visibility .3s;
  }
  .screen.hidden{opacity:0;visibility:hidden;pointer-events:none;}

  .hero{
    width:11em;height:11em;object-fit:contain;
    filter:drop-shadow(0 .8em 1.1em rgba(224,160,40,.38));
    animation:float 3.2s ease-in-out infinite;
  }
  @keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-.6em) rotate(2deg)}}

  .title{
    font-size:2.5em;font-weight:900;letter-spacing:.06em;
    background:linear-gradient(180deg,#eaa81c 0%,#a85a08 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 .085em 0 rgba(255,255,255,.92), 0 .12em .22em rgba(150,95,15,.22);
  }
  .subtitle{font-size:.86em;color:#b08c3c;letter-spacing:.06em;margin-top:-.7em;}

  .btn{
    border:none;cursor:pointer;font-family:inherit;
    padding:.72em 2.6em;border-radius:2em;
    font-size:1.1em;font-weight:800;letter-spacing:.1em;
    color:#6b4310;background:linear-gradient(180deg,#ffe293,#efb63f);
    box-shadow:0 .45em 0 #c18a1e, 0 .8em 1.4em rgba(222,158,44,.4);
    transition:transform .1s, box-shadow .1s;
  }
  .btn:active{transform:translateY(.32em);box-shadow:0 .13em 0 #c18a1e, 0 .3em .8em rgba(222,158,44,.32);}
  .btn.ghost{
    color:#8a6a2e;background:rgba(255,253,243,.92);
    box-shadow:0 0 0 1.5px rgba(230,175,72,.65), 0 .3em .8em rgba(196,150,52,.16);
    font-size:.94em;padding:.66em 2em;
  }
  .btn.orange{background:linear-gradient(180deg,#ffd783,#f0a53f);box-shadow:0 .45em 0 #c17f1d,0 .8em 1.4em rgba(224,150,40,.38);}
  .btn:disabled{opacity:.45;pointer-events:none;}

  .hint{font-size:.72em;color:#bda468;letter-spacing:.05em;text-align:center;line-height:1.9;}

  /* 结算面板 */
  .panel{
    width:100%;max-width:19em;
    background:rgba(255,253,246,.97);
    border-radius:1.4em;padding:1.6em 1.4em 1.4em;
    box-shadow:0 1.2em 2.6em rgba(178,138,50,.26), 0 0 0 1px rgba(255,255,255,.85) inset;
    display:flex;flex-direction:column;align-items:center;gap:.55em;
    animation:popIn .34s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes popIn{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
  .panel h2{font-size:1.35em;color:#d9931f;letter-spacing:.14em;}
  .panel .final{
    font-size:3.2em;font-weight:900;line-height:1;color:#6b4f1d;
    font-variant-numeric:tabular-nums;
  }
  .panel .final small{font-size:.3em;font-weight:700;color:#c2a05f;margin-left:.2em;}
  .panel .bestline{font-size:.78em;color:#b39a5e;}
  .panel .bestline b{color:#d99a2b;font-size:1.15em;}
  .record{
    font-size:.72em;font-weight:800;color:#c17812;letter-spacing:.08em;
    background:#fff2cf;border-radius:1em;padding:.28em .9em;
  }
  .record.hidden{display:none;}
  .panel .btns{display:flex;flex-direction:column;gap:.6em;width:100%;margin-top:.5em;}
  .panel .btns .btn{width:100%;}
  .panel .btns .btn.hidden{display:none;}

  /* 提示气泡 */
  .toast{
    position:absolute;left:50%;top:24%;transform:translate(-50%,-50%) scale(.9);
    background:rgba(107,79,29,.9);color:#fff8e3;
    font-size:.8em;font-weight:700;letter-spacing:.06em;
    padding:.6em 1.3em;border-radius:1.4em;
    opacity:0;pointer-events:none;z-index:8;transition:all .32s ease;
    white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,-50%) scale(1);}

  /* 启动出错时的红条（平时隐藏） */
  #errBox{
    display:none;position:absolute;left:0;right:0;bottom:0;z-index:99;
    background:rgba(178,58,38,.95);color:#fff;
    font:12px/1.5 ui-monospace,Consolas,monospace;
    padding:.6em .8em;white-space:pre-wrap;word-break:break-all;
    max-height:40%;overflow:auto;
  }
</style>
<script>
/* 兜底：脚本在任何位置出错都显示出来，避免出现"点了没反应"却查不到原因 */
window.onerror = function (msg, src, line) {
  var box = document.getElementById('errBox');
  if (!box) return;
  box.style.display = 'block';
  box.textContent = '脚本错误：' + msg + (line ? '（第 ' + line + ' 行）' : '');
};
window.addEventListener('unhandledrejection', function (e) {
  var box = document.getElementById('errBox');
  if (!box) return;
  box.style.display = 'block';
  box.textContent = '未处理的异步错误：' + ((e.reason && e.reason.message) || e.reason);
});
</script>
</head>
<body>
<div id="app">
  <canvas id="cv"></canvas>

  <!-- ================= 顶部信息栏 ================= -->
  <div class="hud" id="hud">
    <div class="hud-left">
      <div class="score-card">
        <span class="lbl">SCORE</span>
        <span class="val" id="scoreVal">0</span>
        <span class="best">最高 <i id="bestVal">0</i></span>
      </div>
    </div>
    <div class="hud-right">
      <div class="next-card">
        <span class="lbl">NEXT</span>
        <img id="nextImg" alt="">
      </div>
      <div class="card-card empty" id="cardCard">
        <span>🎫</span><b id="cardNum">0</b>
      </div>
      <button class="sound-btn" id="btnSound" title="音效开关">🔊</button>
    </div>
  </div>

  <!-- ================= 开始页 ================= -->
  <div class="screen" id="startScreen">
    <img class="hero" id="heroImg" alt="金蕉蛙">
    <div class="title">合成大果蛙</div>
    <div class="subtitle">把果蛙们叠成一只金蕉蛙</div>
    <button class="btn" id="btnStart">开 始 游 戏</button>
    <div class="hint">
      移动鼠标 / 滑动屏幕 瞄准落点<br>
      点击或松手，果蛙就会掉下来
    </div>
  </div>

  <!-- ================= 结算弹窗 ================= -->
  <div class="screen hidden" id="overScreen">
    <div class="panel">
      <h2>游戏结束</h2>
      <div class="final"><span id="finalScore">0</span><small>分</small></div>
      <div class="bestline">历史最高 <b id="finalBest">0</b></div>
      <div class="record hidden" id="newRecord">🎉 新纪录！</div>
      <div class="btns">
        <button class="btn orange" id="btnRevive">使用复活卡继续</button>
        <button class="btn" id="btnRestart">再 来 一 局</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="errBox"></div>
</div>

<script>
/* ==========================================================================
   合成大果蛙  —  单文件 HTML5 合成游戏
   物理：Matter.js  绘制：原生 Canvas 2D
   ========================================================================== */

/* --------------------------------------------------------------------------
   ①  可调参数区（想改手感、难度，基本只动这里）
   -------------------------------------------------------------------------- */
const CFG = {
  W: 440,               // 逻辑画布宽（勿改，代码按 440x720 适配）
  H: 720,               // 逻辑画布高
  pad: 34,              // 左右墙内缩。贴图放大到 2.268× 后，最大那颗贴墙时视觉半径
                        // 比碰撞半径多出 34px（90×2.268×0.885×0.683 − 90 ≈ 33.4），
                        // 所以这里必须同步加大，否则大球贴边会被画布裁掉一块。
  lineY: 158,           // 警戒线高度：果蛙顶部越过这条线并停留会被判负
  dropY: 98,            // 待投放果蛙的中心高度（贴图放大后要适当上移，否则脚会压在警戒线上）
  gravity: 1.05,        // 重力大小（越大落得越快）
  overSeconds: 1.4,     // 越过警戒线持续多少秒算失败
  cooldown: 0.30,       // 两次投放之间的冷却（秒）
  cardPer: 2000,        // 每达到这么多分送一张复活卡
  maxSpeed: 26,         // 速度上限，防止高速穿模
  groundY: 690,         // 地面高度（下面留出草地，果蛙的脚才不会被屏幕切掉）
  spawnPool: [1,1,1,1, 2,2,2, 3,3, 4],  // 投放池：数字=等级，重复=概率
  // 图片绘制大小 / 碰撞圆直径。
  // 贴图是 300x300 的方图，内容只占 71.7% 宽 / 95% 高，makeSprite 外圈又留了 22px 描边
  // （实际内容占 340/384 = 0.885）。所以外观宽度 = 2r × spriteScale × 0.885 × 0.717。
  // spriteScale = 1.62 时肚子正好填满碰撞圆；本轮在此基础上再放大 40%：
  // 1.62 × 1.4 = 2.268。视觉上比碰撞圆大一圈，挨在一起时会有明显叠压，这是要的效果。
  spriteScale: 2.268,
  sfxFromLevel: 4,      // 合成出第 4 级及以上的果蛙时播放音效
  spriteInnerRatio: 340 / 384,   // 贴图内容占贴图方块的比例（跟 makeSprite 里的 pad 联动，改 pad 要同步改这里）
  spriteContentH: 0.95,          // 贴图内容在垂直方向占方图的比例（9 张实测 0.947~0.950）
  lockRotation: false,  // false=像真水果一样翻滚，不会永远正立
};

// 果蛙"看得见的顶端"离圆心有多远（单位 r）。判定越线要用它，不能用 b.r，
// 否则贴图放大后会出现"明明还没碰到线就输了 / 已经明显越线却不判负"的对不上的情况。
const VIS_TOP = CFG.spriteScale * CFG.spriteInnerRatio * CFG.spriteContentH;

/* --------------------------------------------------------------------------
   ⑥  图片预加载 + 生成"白描边"贴图
   -------------------------------------------------------------------------- */
function makeSprite(img){
  // 把图片画到离屏 canvas，并加一圈柔和的白色描边（先把轮廓的阴影铺两次）
  // 贴图放大到 2.268× 之后，最大那颗要画到 408 逻辑像素宽（DPR 2 下是 816），
  // 384 的离屏画布已经不够用了，会明显发虚，所以提到 512。
  const S = 512;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const g = c.getContext('2d');
  // 留白按比例走（22/384 = 0.0573），这样改 S 只影响清晰度，不改变外观比例，
  // CFG.spriteInnerRatio 也就不用跟着动。
  const pad = S * (22 / 384), inner = S - pad * 2;
  g.save();
  g.shadowColor = 'rgba(255,255,255,1)';
  g.shadowBlur = 16 * (S / 384);
  g.drawImage(img, pad, pad, inner, inner);
  g.drawImage(img, pad, pad, inner, inner);
  g.restore();
  g.drawImage(img, pad, pad, inner, inner);  // 本体最后画，盖住阴影内溢
  return c;
}

// 图片是内嵌的 base64，正常几十毫秒就能解码完。
// 这里仍然给每一张加 2.5 秒超时兜底，保证任何一张出问题都不会把启动流程卡死。
function loadImages(){
  return new Promise(resolve => {
    const list = new Array(FRUIT_SRC.length).fill(null);
    let left = FRUIT_SRC.length;
    if (left === 0){ sprites = []; resolve(); return; }

    FRUIT_SRC.forEach((src, i) => {
      const im = new Image();
      let settled = false;
      const finish = ok => {
        if (settled) return;
        settled = true;
        list[i] = ok ? im : null;
        if (--left === 0){
          sprites = list.map(x => x ? makeSprite(x) : null);
          resolve();
        }
      };
      im.onload = () => finish(true);
      im.onerror = () => finish(false);
      im.src = src;
      setTimeout(() => finish(im.complete && im.naturalWidth > 0), 2500);
    });
  });
}

/* --------------------------------------------------------------------------
   ⑦  物理世界
   -------------------------------------------------------------------------- */
function createWorld(){
  engine = Matter.Engine.create();
  engine.gravity.y = CFG.gravity;
  engine.positionIterations = 8;
  engine.velocityIterations = 6;
  world = engine.world;

  const opt = { isStatic:true, friction:.5, restitution:.05 };
  const t = 60;
  const left  = Matter.Bodies.rectangle(CFG.pad - t/2, CFG.H/2, t, CFG.H*2, opt);
  const right = Matter.Bodies.rectangle(CFG.W - CFG.pad + t/2, CFG.H/2, t, CFG.H*2, opt);
  const floor = Matter.Bodies.rectangle(CFG.W/2, CFG.groundY + t/2, CFG.W*2, t, opt);
  Matter.Composite.add(world, [left, right, floor]);

  // 碰撞回调：只负责"登记"要合成的配对，真正合并放到物理步之后做
  Matter.Events.on(engine, 'collisionStart', evt => {
    for (const pair of evt.pairs){
      const a = pair.bodyA, b = pair.bodyB;
      if (!a.isFrog || !b.isFrog) continue;
      if (a.dead || b.dead || a.merging || b.merging) continue;
      if (a.level !== b.level) continue;
      a.merging = b.merging = true;
      mergeQueue.push([a, b]);
    }
  });
}

function spawnFruit(level, x, y){
  const info = FRUITS[level-1];
  const body = Matter.Bodies.circle(x, y, info.r, {
    restitution: .1,
    friction: .5,
    frictionStatic: .85,
    frictionAir: .004,
    density: .0012,
    slop: .03,
  });
  // 锁定旋转：人形果蛙一旦横躺会很难看，锁死后永远是正立的玩偶。
  // 把 CFG.lockRotation 改成 false 就能看到它们翻滚的样子。
  if (CFG.lockRotation) Matter.Body.setInertia(body, Infinity);
  body.isFrog = true;
  body.level = level;
  body.r = info.r;
  body.merging = false;
  body.dead = false;
  body.pop = 0;        // 0→1 的弹出动画进度
  body.age = 0;
  body.armed = false;  // 是否已落过警戒线（免疫解除）
  body.overAcc = 0;    // 越线累计时间
  Matter.Composite.add(world, body);
  fruits.set(body.id, body);
  return body;
}

function removeFruit(body){
  if (!body || body.dead) return;
  body.dead = true;
  fruits.delete(body.id);
  Matter.Composite.remove(world, body);
}

let sfxCtx = null, sfxBuf = null, sfxBus = null, sfxReq = false;
let sfxOn = Store.get('frog_sfx', '1') !== '0';

const SFX_ANCHOR = 4;       // 第 4 级 = 音高 1.0 基准（与 CFG.sfxFromLevel 保持一致）
const SFX_MAX_RATE = 2.5;   // 第 9 级封顶 2.5 倍音高
const SFX_BASE_GAIN = .6;   // 响度固定：不管第几级，音量都一样

// 第 4 级 → 1.00，第 9 级 → 2.50，中间等比切分。
// 这样 6 个档位正好铺满、既不撞顶（后面几级听起来一样）也不会拉开得太猛。
function sfxRateFor(level){
  const span = MAX_LEVEL - SFX_ANCHOR;                  // 9 - 4 = 5
  const n = Math.min(span, Math.max(0, (level | 0) - SFX_ANCHOR));
  return Math.pow(SFX_MAX_RATE, n / span);
}

function b64ToBuffer(b64){
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8.buffer;
}

function decodeAudio(onDone){
  if (sfxReq) return;
  sfxReq = true;
  try{
    // 老 Safari 走回调、新浏览器返回 Promise，两种都接上
    const p = sfxCtx.decodeAudioData(b64ToBuffer(AUDIO_B64), onDone, function(){});
    if (p && p.then) p.then(onDone).catch(function(){});
  }catch(e){}
}

function initSfx(){
  if (!sfxCtx){
    try{
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      sfxCtx = new AC();
    }catch(e){ sfxCtx = null; return; }   // 某些环境不给 AudioContext，静音降级，别影响游戏
  }
  if (sfxCtx.state === 'suspended'){ try{ sfxCtx.resume(); }catch(e){} }
  if (!sfxBus){
    try{
      // 过一道压限器，连着合好几下也不会破音
      sfxBus = sfxCtx.createGain();
      const comp = sfxCtx.createDynamicsCompressor();
      comp.threshold.value = -6; comp.knee.value = 6; comp.ratio.value = 12;
      comp.attack.value = .004; comp.release.value = .25;
      sfxBus.connect(comp); comp.connect(sfxCtx.destination);
    }catch(e){ sfxBus = null; }
  }
  if (!sfxBuf) decodeAudio(function(b){ sfxBuf = b; });
}

function playMergeSfx(level){
  if (!sfxOn) return;
  initSfx();
  if (!sfxCtx || !sfxBus || !sfxBuf) return;
  try{
    const src = sfxCtx.createBufferSource();
    const gain = sfxCtx.createGain();
    src.buffer = sfxBuf;
    src.playbackRate.value = sfxRateFor(level);   // ← 升调全靠这一行
    gain.gain.value = SFX_BASE_GAIN;              // ← 响度不随等级变
    src.connect(gain); gain.connect(sfxBus);
    src.start(0);
  }catch(e){}
}

function setSfxOn(on){
  sfxOn = on;
  Store.set('frog_sfx', on ? '1' : '0');
  const btn = document.getElementById('btnSound');
  if (btn){
    btn.textContent = on ? '🔊' : '🔇';
    btn.classList.toggle('off', !on);
  }
}

function handleMerge(a, b){
  if (!fruits.has(a.id) || !fruits.has(b.id)) return;

  const lvl = a.level;
  const mx = (a.position.x + b.position.x) / 2;
  const my = (a.position.y + b.position.y) / 2;
  const vx = (a.velocity.x + b.velocity.x) * .4;
  const vy = (a.velocity.y + b.velocity.y) * .4;

  removeFruit(a);
  removeFruit(b);

  // 最高级相撞：直接消除，加最高分
  if (lvl >= MAX_LEVEL){
    addScore(TOP_SCORE);
    addPopup(mx, my, '+' + TOP_SCORE, '#f2b632');
    addBurst(mx, my, '#ffd15c', 26, 1.8);
    addBurst(mx, my, '#fff3c4', 14, 1.2);
    playMergeSfx(MAX_LEVEL);
    return;
  }

  // 常规合成：升一级
  const nl = lvl + 1;
  if (nl >= CFG.sfxFromLevel) playMergeSfx(nl);   // 第 4 级起有声音，等级越高音调越高
  const nb = spawnFruit(nl, clamp(mx, CFG.pad + FRUITS[nl-1].r, CFG.W - CFG.pad - FRUITS[nl-1].r), my);
  Matter.Body.setVelocity(nb, { x:vx, y: vy - 1.6 });
  addScore(FRUITS[nl-1].score);
  addPopup(mx, my, '+' + FRUITS[nl-1].score, FRUITS[nl-1].color);
  addBurst(mx, my, FRUITS[nl-1].color, 12, 1);
}

/* --------------------------------------------------------------------------
   ⑨  分数 / 复活卡
   -------------------------------------------------------------------------- */
const scoreEl = document.getElementById('scoreVal');
const bestEl = document.getElementById('bestVal');
const cardNumEl = document.getElementById('cardNum');
const cardCardEl = document.getElementById('cardCard');

function addScore(n){
  score += n;
  scoreEl.textContent = score;
  scoreEl.classList.remove('bump');
  void scoreEl.offsetWidth;   // 重启动画
  scoreEl.classList.add('bump');

  // 历史最高分实时刷新并落盘
  if (score > best){
    best = score;
    bestEl.textContent = best;
    Store.set('frog_best', best);
  }

  // 每跨过一个 cardPer 的整数倍，送一张复活卡
  const target = Math.floor(score / CFG.cardPer);
  while (cardsEarned < target){
    cardsEarned++;
    showToast('🎫 获得一张复活卡！');
  }
  refreshCardUI();
}

function refreshCardUI(){
  const left = Math.max(0, cardsEarned - cardsUsed);
  cardNumEl.textContent = left;
  cardCardEl.classList.toggle('empty', left <= 0);
}

/* --------------------------------------------------------------------------
   ⑩  投放
   -------------------------------------------------------------------------- */
function randLevel(){ return pick(CFG.spawnPool); }

function setAim(clientX){
  const rect = cv.getBoundingClientRect();
  const x = (clientX - rect.left) / rect.width * CFG.W;
  const r = FRUITS[holdLevel-1].r;
  aimX = clamp(x, CFG.pad + r, CFG.W - CFG.pad - r);
}

function drop(){
  if (state !== 'playing' || dropCD > 0) return;
  const b = spawnFruit(holdLevel, aimX, CFG.dropY);
  Matter.Body.setVelocity(b, { x:0, y:2.2 });
  b.pop = 1;   // 投放的果蛙不用弹出动画
  holdLevel = nextLevel;
  nextLevel = randLevel();
  dropCD = CFG.cooldown;
  refreshNext();
  addBurst(aimX, CFG.dropY + FRUITS[holdLevel-1].r * .4, '#cfe9d8', 5, .5);
}

const nextImg = document.getElementById('nextImg');
function refreshNext(){
  nextImg.src = FRUIT_SRC[nextLevel-1];
}

/* --------------------------------------------------------------------------
   ⑪  每帧物理之后的处理：合成、越线判定、限速
   -------------------------------------------------------------------------- */
function afterPhysics(dt){
  // 1) 处理合成
  while (mergeQueue.length){
    const [a, b] = mergeQueue.shift();
    handleMerge(a, b);
  }

  // 2) 限速（防高速穿模）+ 越线判定
  const now = performance.now();
  const safe = now < safeUntil;
  let over = false;

  for (const b of fruits.values()){
    const sp = Math.hypot(b.velocity.x, b.velocity.y);
    if (sp > CFG.maxSpeed){
      Matter.Body.setVelocity(b, {
        x: b.velocity.x * CFG.maxSpeed / sp,
        y: b.velocity.y * CFG.maxSpeed / sp,
      });
    }

    b.age += dt;
    if (b.pop < 1) b.pop = Math.min(1, b.pop + dt * 5.5);

    // 用"看得见的顶端"判定，而不是碰撞圆顶端：贴图比碰撞圆高，用 b.r 会让玩家觉得判负莫名其妙
    const top = b.position.y - b.r * VIS_TOP;
    // 免疫：刚投放/刚合成的果蛙要先"落到线下"或超过 2.5 秒才参与判定
    if (!b.armed && (top > CFG.lineY - 2 || b.age > 2.5)) b.armed = true;

    if (b.armed && top < CFG.lineY){
      b.overAcc += dt;
      over = true;
      if (!safe && b.overAcc > CFG.overSeconds){
        triggerGameOver();
        return;
      }
    } else {
      b.overAcc = Math.max(0, b.overAcc - dt * 3);
    }
  }
  dangerFlag = over;
}

let dangerFlag = false;

/* --------------------------------------------------------------------------
   ⑫  失败 / 复活 / 重开
   -------------------------------------------------------------------------- */
const overScreen = document.getElementById('overScreen');
const finalScoreEl = document.getElementById('finalScore');
const finalBestEl = document.getElementById('finalBest');
const newRecordEl = document.getElementById('newRecord');
const btnRevive = document.getElementById('btnRevive');

function triggerGameOver(){
  if (state !== 'playing') return;
  state = 'over';

  isNewRecord = score > bestAtStart;   // 本局是否刷新了历史记录
  bestEl.textContent = best;

  finalScoreEl.textContent = score;
  finalBestEl.textContent = best;
  newRecordEl.classList.toggle('hidden', !isNewRecord);

  const left = Math.max(0, cardsEarned - cardsUsed);
  btnRevive.textContent = '使用复活卡继续（剩 ' + left + '）';
  btnRevive.classList.toggle('hidden', left <= 0);

  overScreen.classList.remove('hidden');
}

function revive(){
  if (state !== 'over') return;
  if (cardsEarned - cardsUsed <= 0) return;
  cardsUsed++;
  refreshCardUI();

  // 消除所有越过警戒线的果蛙（这种方式消除不得分）
  const doomed = [];
  for (const b of fruits.values()){
    if (b.position.y - b.r * VIS_TOP < CFG.lineY + 26) doomed.push(b);
  }
  doomed.sort((x, y) => (x.position.y - x.r * VIS_TOP) - (y.position.y - y.r * VIS_TOP));
  for (const b of doomed.slice(0, 40)){
    addBurst(b.position.x, b.position.y, FRUITS[b.level-1].color, 8, .9);
    removeFruit(b);
  }

  // 剩下的果蛙重置计时，并给一段保护期让堆叠稳定
  for (const b of fruits.values()){
    b.overAcc = 0;
    b.armed = false;
    b.age = 0;
  }
  safeUntil = performance.now() + 1600;
  state = 'playing';
  overScreen.classList.add('hidden');
}

function resetGame(){
  // 只清果蛙，保留静态墙体
  Matter.Composite.clear(world, true);
  fruits.clear();
  mergeQueue.length = 0;
  particles.length = 0;
  popups.length = 0;

  score = 0;
  bestAtStart = best;      // 记录开局时的历史最高分
  cardsEarned = 0;
  cardsUsed = 0;
  holdLevel = randLevel();
  nextLevel = randLevel();
  aimX = CFG.W / 2;
  dropCD = 0;
  safeUntil = performance.now() + 600;
  isNewRecord = false;

  scoreEl.textContent = '0';
  bestEl.textContent = best;
  refreshCardUI();
  refreshNext();

  state = 'playing';
  overScreen.classList.add('hidden');
}

/* --------------------------------------------------------------------------
   ⑬  提示气泡
   -------------------------------------------------------------------------- */
const toastEl = document.getElementById('toast');
let toastTimer = 0;
function showToast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 1500);
}

/* --------------------------------------------------------------------------
   ⑭  特效：粒子 & 飘字
   -------------------------------------------------------------------------- */
function addBurst(x, y, color, n, power){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2;
    const s = (1.2 + Math.random() * 3) * (power || 1);
    particles.push({
      x, y,
      vx: Math.cos(a) * s,
      vy: Math.sin(a) * s - 1.2,
      life: 1,
      r: 1.6 + Math.random() * 3.2,
      color,
    });
  }
}

function addPopup(x, y, text, color){
  popups.push({ x, y, text, color, life: 1 });
}

function updateEffects(dt){
  for (let i = particles.length - 1; i >= 0; i--){
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.vy += 0.22;
    p.vx *= 0.98;
    p.life -= dt * 2.1;
    if (p.life <= 0) particles.splice(i, 1);
  }
  for (let i = popups.length - 1; i >= 0; i--){
    const t = popups[i];
    t.y -= 34 * dt;
    t.life -= dt * 1.25;
    if (t.life <= 0) popups.splice(i, 1);
  }
}

/* --------------------------------------------------------------------------
   ⑮  绘制
   -------------------------------------------------------------------------- */
function roundRect(c, x, y, w, h, r){
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function drawBackground(){
  const g = ctx.createLinearGradient(0, 0, 0, CFG.H);
  g.addColorStop(0, '#fffaf0');
  g.addColorStop(.5, '#fffdf6');
  g.addColorStop(1, '#ffe9ba');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, CFG.W, CFG.H);

  // 柔光斑
  const glow = ctx.createRadialGradient(CFG.W * .22, CFG.H * .78, 10, CFG.W * .22, CFG.H * .78, CFG.W * .55);
  glow.addColorStop(0, 'rgba(250,206,110,.30)');
  glow.addColorStop(1, 'rgba(250,206,110,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, CFG.W, CFG.H);

  const glow2 = ctx.createRadialGradient(CFG.W * .85, CFG.H * .3, 10, CFG.W * .85, CFG.H * .3, CFG.W * .5);
  glow2.addColorStop(0, 'rgba(255,232,160,.38)');
  glow2.addColorStop(1, 'rgba(255,232,160,0)');
  ctx.fillStyle = glow2;
  ctx.fillRect(0, 0, CFG.W, CFG.H);

  // 底部草地（果蛙站在这里，脚部轻微陷进草丛）
  const gy = CFG.groundY;
  const gg = ctx.createLinearGradient(0, gy, 0, CFG.H);
  gg.addColorStop(0, '#e8edb4');
  gg.addColorStop(.6, '#dbe4a0');
  gg.addColorStop(1, '#ccd78c');
  ctx.fillStyle = gg;
  ctx.fillRect(0, gy, CFG.W, CFG.H - gy);
  // 草叶
  ctx.fillStyle = 'rgba(203,214,138,.95)';
  for (let x = 6; x < CFG.W; x += 17){
    const h = 5 + ((x * 7) % 5);
    ctx.beginPath();
    ctx.moveTo(x, gy + 1);
    ctx.lineTo(x + 3.5, gy - h);
    ctx.lineTo(x + 7, gy + 1);
    ctx.closePath();
    ctx.fill();
  }
  ctx.fillStyle = 'rgba(255,255,255,.35)';
  ctx.fillRect(0, gy, CFG.W, 2);

  // 罐子边框
  ctx.save();
  roundRect(ctx, CFG.pad - 1, -20, CFG.W - CFG.pad * 2 + 2, CFG.H + 40, 22);
  ctx.strokeStyle = 'rgba(224,180,90,.45)';
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();
}

function drawGuideLine(){
  if (state !== 'playing') return;
  ctx.save();
  ctx.setLineDash([6, 10]);
  ctx.strokeStyle = 'rgba(224,180,90,.28)';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(aimX, CFG.dropY + 26);
  ctx.lineTo(aimX, CFG.groundY - 6);
  ctx.stroke();
  ctx.restore();
}

function drawWarnLine(){
  const danger = dangerFlag;
  ctx.save();
  ctx.setLineDash([11, 9]);
  ctx.lineWidth = danger ? 3 : 2;
  ctx.strokeStyle = danger ? 'rgba(226,74,52,.92)' : 'rgba(240,150,66,.6)';
  ctx.beginPath();
  ctx.moveTo(CFG.pad + 2, CFG.lineY);
  ctx.lineTo(CFG.W - CFG.pad - 2, CFG.lineY);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.font = '600 11px system-ui, sans-serif';
  ctx.fillStyle = danger ? 'rgba(226,74,52,.95)' : 'rgba(226,146,52,.85)';
  ctx.textBaseline = 'bottom';
  ctx.fillText('警戒线', CFG.pad + 8, CFG.lineY - 4);
  ctx.restore();
}

function drawOne(body){
  const sp = sprites[body.level - 1];
  const popT = body.pop >= 1 ? 1 : easeOutBack(body.pop);
  const scale = 0.35 + 0.65 * popT;
  const D = body.r * 2 * CFG.spriteScale * scale;

  ctx.save();
  ctx.translate(body.position.x, body.position.y);
  ctx.rotate(body.angle);
  if (sp){
    // 极淡的暖色投影，让黄色系果蛙在暖黄背景上也能分离出来
    ctx.shadowColor = 'rgba(158,116,42,.28)';
    ctx.shadowBlur = 7;
    ctx.shadowOffsetY = 4;
    ctx.drawImage(sp, -D/2, -D/2, D, D);
    ctx.shadowColor = 'rgba(0,0,0,0)';
  } else {
    // 图片没加载出来的兜底
    ctx.beginPath();
    ctx.arc(0, 0, body.r, 0, Math.PI * 2);
    ctx.fillStyle = FRUITS[body.level-1].color;
    ctx.fill();
  }
  ctx.restore();
}

function drawHold(){
  if (state !== 'playing') return;
  const lvl = holdLevel;
  const sp = sprites[lvl-1];
  const r = FRUITS[lvl-1].r;
  const D = r * 2 * CFG.spriteScale;
  const bob = Math.sin(clock * 3) * 2.2;
  ctx.save();
  ctx.globalAlpha = dropCD > 0 ? .35 : 1;
  ctx.translate(aimX, CFG.dropY + bob);
  if (sp) ctx.drawImage(sp, -D/2, -D/2, D, D);
  ctx.restore();
}

function drawEffects(){
  for (const p of particles){
    ctx.globalAlpha = Math.max(0, p.life) * .9;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * p.life, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const t of popups){
    const a = Math.min(1, t.life * 1.6);
    ctx.globalAlpha = a;
    ctx.font = '800 20px system-ui, sans-serif';
    ctx.lineWidth = 4;
    ctx.strokeStyle = 'rgba(255,255,255,.9)';
    ctx.strokeText(t.text, t.x, t.y);
    ctx.fillStyle = t.color;
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'start';
  ctx.textBaseline = 'alphabetic';
}

function render(dt){
  drawBackground();
  drawGuideLine();
  drawWarnLine();
  // 贴图放大到 2.268× 之后，相邻的球必然会互相压住一大块
  // （视觉直径已经是碰撞直径的 1.4~1.9 倍）。所以这里按 y 从小到大画：
  // 上面的球先画、下面的球后画，重叠处就变成"前面挡住后面"的自然遮挡，
  // 而不是两颗球咬着彼此的边。顺便 clip 一下，旋转时贴图不会压到边框上。
  ctx.save();
  ctx.beginPath();
  ctx.rect(CFG.pad - 2, 0, CFG.W - CFG.pad * 2 + 4, CFG.H);
  ctx.clip();
  const order = [];
  for (const b of fruits.values()) order.push(b);
  order.sort(function(p, q){ return p.position.y - q.position.y; });
  for (let i = 0; i < order.length; i++) drawOne(order[i]);
  ctx.restore();
  drawEffects();
  drawHold();
}

/* --------------------------------------------------------------------------
   ⑯  主循环
   -------------------------------------------------------------------------- */
function loop(ts){
  requestAnimationFrame(loop);
  if (!lastTS) lastTS = ts;
  const raw = Math.min(ts - lastTS, 100);
  lastTS = ts;
  const dt = raw / 1000;
  clock += dt;

  if (state === 'playing'){
    dropCD = Math.max(0, dropCD - dt);
    acc += raw;
    let n = 0;
    while (acc >= FIXED && n < 4){
      Matter.Engine.update(engine, FIXED);
      acc -= FIXED;
      n++;
      afterPhysics(FIXED / 1000);
      if (state !== 'playing') break;
    }
    if (n >= 4) acc = 0;
  }

  updateEffects(dt);
  render(dt);
}

/* --------------------------------------------------------------------------
   ⑰  输入（鼠标 + 触屏统一用 Pointer Events）
   -------------------------------------------------------------------------- */
function bindInput(){
  cv.addEventListener('pointerdown', e => {
    if (state !== 'playing') return;
    pointerDown = true;
    setAim(e.clientX);
    e.preventDefault();
  });

  cv.addEventListener('pointermove', e => {
    if (state !== 'playing') return;
    // 鼠标不用按下也能瞄准；触屏必须按住拖动
    if (e.pointerType === 'mouse' || pointerDown) setAim(e.clientX);
  });

  window.addEventListener('pointerup', e => {
    if (!pointerDown) return;
    pointerDown = false;
    if (state !== 'playing') return;
    setAim(e.clientX);
    drop();
  });

  window.addEventListener('pointercancel', () => { pointerDown = false; });

  // 桌面端：鼠标移出画布也不影响下次进入
  cv.addEventListener('contextmenu', e => e.preventDefault());
}

/* --------------------------------------------------------------------------
   ⑱  自适应布局
   -------------------------------------------------------------------------- */
const app = document.getElementById('app');
function layout(){
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const scale = Math.min(vw / CFG.W, vh / CFG.H) * 0.98;
  app.style.width = Math.floor(CFG.W * scale) + 'px';
  app.style.height = Math.floor(CFG.H * scale) + 'px';
  app.style.fontSize = (16 * scale) + 'px';

  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const bw = Math.round(CFG.W * dpr);
  const bh = Math.round(CFG.H * dpr);
  if (cv.width !== bw || cv.height !== bh){
    cv.width = bw;
    cv.height = bh;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
}

/* --------------------------------------------------------------------------
   ⑲  启动
   -------------------------------------------------------------------------- */
const startScreen = document.getElementById('startScreen');
const hudEl = document.getElementById('hud');
let ready = false;   // 物理世界与贴图是否就绪

// 启动失败时把原因直接摆在页面上，而不是静默卡住
function fatal(err){
  console.error('[合成大果蛙] 启动失败：', err);
  const btn = document.getElementById('btnStart');
  if (btn){ btn.disabled = false; btn.textContent = '启 动 失 败'; }
  const box = document.getElementById('errBox');
  if (box){
    box.style.display = 'block';
    box.textContent = '启动失败：' + ((err && err.message) || err);
  }
}

function bindUI(){
  document.getElementById('btnStart').addEventListener('click', () => {
    // 就算素材还没就绪也要能开始：现场补一次初始化，绝不让按钮变成"死键"
    if (!ready){
      try {
        if (!world) createWorld();
        ready = true;
      } catch (err) { fatal(err); return; }
    }
    hudEl.style.opacity = '1';
    startScreen.classList.add('hidden');
    initSfx();          // 在用户点击的这一刻初始化音频，绕过浏览器的自动播放限制
    resetGame();
  });
  document.getElementById('btnRestart').addEventListener('click', () => {
    resetGame();
  });
  btnRevive.addEventListener('click', () => {
    revive();
  });
  const sBtn = document.getElementById('btnSound');
  if (sBtn){
    sBtn.addEventListener('click', e => {
      e.stopPropagation();
      setSfxOn(!sfxOn);
    });
  }
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 120));
}

function boot(){
  try {
    layout();
    // 先把界面和输入绑好：哪怕后面任何一步慢了，按钮也是活的
    bindInput();
    bindUI();

    bestEl.textContent = best;
    hudEl.style.opacity = '0';   // 开始页先把顶栏藏起来
    holdLevel = randLevel();
    nextLevel = randLevel();
    refreshNext();
    refreshCardUI();
    setSfxOn(sfxOn);   // 恢复上次的音效开关状态（图标 + 静音）
    document.getElementById('heroImg').src = FRUIT_SRC[MAX_LEVEL-1];
  } catch (err) {
    return fatal(err);
  }

  const btn = document.getElementById('btnStart');
  btn.textContent = '准 备 中…';

  loadImages().then(() => {
    try {
      createWorld();
      ready = true;
      btn.textContent = '开 始 游 戏';
      requestAnimationFrame(loop);
    } catch (err) {
      fatal(err);
    }
  }).catch(fatal);
}

boot();
</script>
</body>
</html>
